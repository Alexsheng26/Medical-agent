[project]
name = "medical-research-agent"
version = "0.1.0"
description = "Research intermediary agent for clinical and translational medicine"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.120",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# For pointing the tool at an OpenAI-compatible endpoint (DeepSeek and friends).
openai = ["openai>=1.40"]

[project.scripts]
mra = "mra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mra*"]

[tool.setuptools.package-data]
mra = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
